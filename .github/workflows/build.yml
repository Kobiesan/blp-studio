name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python test_blp_studio.py
      - run: python test_formats.py
      - run: python test_desktop.py
      - run: python -m PyInstaller --noconfirm BLPStudio.spec
      - run: python test_release.py dist/BLPStudio.exe
      - run: python package_release.py dist/BLPStudio.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BLP-Studio-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
